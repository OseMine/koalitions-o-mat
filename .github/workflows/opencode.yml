name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      contains(github.event.comment.body, ' /oc') ||
      startsWith(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, ' /opencode') ||
      startsWith(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/deepseek-v4-flash-free
          use_github_token: true
          prompt: |
            Du arbeitest am Koalitions-O-Mat, einer Vanilla-JavaScript-Wahlapp
            (kein Framework, kein Build-Schritt; Node + static server reicht).

            Kontext-Sammlung:
            1. Lies README.md, opencode.json und ggf. die Issue-/PR-Beschreibung und
               den auslösenden Kommentar. Folge `t()`/`einfache-sprache.json`-Konventionen.
            2. Prüfe bestehende Befunde in todo.md / archived-todo.md, um nichts doppelt
               zu implementieren oder bekannte Konventionen zu verletzen.

            Regeln:
            - Committe NICHT, pushe NICHT selbst und öffne KEINEN Pull Request – die
              GitHub-Action erkennt die geänderten Dateien automatisch, committed/pusht
              auf einen Branch und erstellt den PR.
            - Ändere niemals Secrets und keine Dateien unter `.github/workflows/`
              (die GitHub-App hat dafür keine Berechtigung).
            - Bei Issue-basierten Aufträgen: halte dich an Titel-Präfix und Struktur der
              Vorlagen in `.github/ISSUE_TEMPLATE/` (Bug, Feature, Datenfehler, Einfache
              Sprache), sofern im Kontext anwendbar.
            - Erkläre am Ende knapp, was du geändert hast (max. 10 Stichpunkte).